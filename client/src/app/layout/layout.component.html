<nav class="layout-navbar">
  <div class="layout-navbar-inner">
    <div class="layout-navbar-start">
      <button
        type="button"
        class="layout-menu-btn"
        (click)="toggleSidebar()"
        aria-label="Alternar menú"
      >
        <i class="bx bx-menu"></i>
      </button>

      <a [routerLink]="inicioRuta" class="layout-brand">
        <img
          src="assets/img/logotipo.webp"
          alt="Pollocoa"
          class="layout-brand-logo layout-brand-logo--pollocoa"
        />
        <span class="layout-brand-name">CEM-Despachos</span>
      </a>
    </div>

    <div class="layout-user">
      <i class="bx bx-user layout-user-icon"></i>
      <div class="layout-user-text">
        <span class="layout-user-name">{{ identity }}</span>
        <span class="layout-user-role">{{ perfilNombre }} · Pollocoa</span>
      </div>
    </div>
  </div>
</nav>

<aside
  class="layout-sidebar"
  [class.layout-sidebar--collapsed]="isSidebarCollapsed() && !isSidebarHovered()"
  [class.layout-sidebar--expanded]="!isSidebarCollapsed() || isSidebarHovered()"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
>
  <div class="layout-sidebar-scroll">
    <ul class="layout-nav">
      <li *ngFor="let item of mainVisibles; trackBy: trackItem">
        <a
          [routerLink]="item.route"
          routerLinkActive="nav-link-active"
          class="layout-nav-link"
        >
          <i class="bx layout-nav-icon" [ngClass]="item.icon"></i>
          <span class="layout-nav-label" *ngIf="showLabels()">{{ item.label }}</span>
        </a>
      </li>

      <li *ngFor="let group of gruposVisibles; trackBy: trackGroup">
        <button
          type="button"
          class="layout-nav-link"
          [class.nav-link-active]="isGroupActive(group.id)"
          (click)="toggleGroup(group.id, $event)"
        >
          <i class="bx layout-nav-icon" [ngClass]="group.icon"></i>
          <ng-container *ngIf="showLabels()">
            <span class="layout-nav-label">{{ group.label }}</span>
            <i
              class="bx bx-chevron-down layout-nav-caret"
              [class.layout-nav-caret--open]="isGroupOpen(group.id)"
            ></i>
          </ng-container>
        </button>
        <ul class="layout-nav-sub" *ngIf="isGroupOpen(group.id) && showLabels()">
          <li *ngFor="let item of group.items; trackBy: trackItem">
            <a
              [routerLink]="item.route"
              routerLinkActive="nav-link-active"
              class="layout-nav-link layout-nav-link--sub"
            >
              <i class="bx layout-nav-icon" [ngClass]="item.icon"></i>
              <span class="layout-nav-label">{{ item.label }}</span>
            </a>
          </li>
        </ul>
      </li>
    </ul>

    <ul class="layout-nav layout-nav--footer">
      <li>
        <button type="button" class="layout-nav-link layout-nav-link--logout" (click)="logout()">
          <i class="bx bx-log-out layout-nav-icon"></i>
          <span class="layout-nav-label" *ngIf="showLabels()">Cerrar sesión</span>
        </button>
      </li>
    </ul>
  </div>
</aside>

<main
  class="layout-main"
  [class.layout-main--collapsed]="isSidebarCollapsed()"
  [class.layout-main--expanded]="!isSidebarCollapsed()"
>
  <div class="layout-content">
    <router-outlet></router-outlet>
  </div>
</main>

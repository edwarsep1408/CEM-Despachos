<div class="content-title">
  <div>
    <h3>Permisos</h3>
    <p class="text-muted small mb-0">Catálogo de acciones. Se asignan a los perfiles.</p>
  </div>
  <div class="d-grid gap-2 d-md-flex justify-content-md-end">
    <div class="input-group input-search">
      <span class="input-group-text search-icon"><i class="ri-search-line"></i></span>
      <input type="text" class="form-control search-input" (keyup)="applyFilter($event)" placeholder="Buscar">
    </div>
    <button type="button" class="btn btn-primary" data-bs-toggle="offcanvas" data-bs-target="#offcanvasPermiso">
      <i class="ri-add-circle-fill"></i> Nuevo permiso
    </button>
  </div>
</div>

<div class="mat-elevation-z4">
  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container matColumnDef="modulo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>MÓDULO</th>
      <td mat-cell *matCellDef="let row">{{ row.modulo }}</td>
    </ng-container>
    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>CÓDIGO</th>
      <td mat-cell *matCellDef="let row">{{ row.codigo }}</td>
    </ng-container>
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>NOMBRE</th>
      <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>ACCIONES</th>
      <td mat-cell *matCellDef="let row">
        <button class="btn btn-edit" data-bs-toggle="offcanvas" data-bs-target="#offcanvasPermisoEdit" (click)="onClickDato(row)">
          <i class="bi bi-pencil-square"></i>
        </button>
        <button class="btn btn-delete" (click)="onDelete(row._id)"><i class="bi bi-trash3-fill"></i></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[10, 20, 50]" showFirstLastButtons></mat-paginator>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasPermiso">
  <form (submit)="onSubmit()" #AddForm="ngForm">
    <div class="offcanvas-header"><h6 class="offcanvas-title">Nuevo permiso</h6></div>
    <div class="offcanvas-body">
      <div class="form-floating mb-3">
        <input class="form-control" [(ngModel)]="addForm.modulo" name="modulo" required placeholder="módulo">
        <label>Módulo</label>
      </div>
      <div class="form-floating mb-3">
        <input class="form-control" [(ngModel)]="addForm.codigo" name="codigo" required placeholder="código">
        <label>Código (ej. despacho.pedidos)</label>
      </div>
      <div class="form-floating mb-3">
        <input class="form-control" [(ngModel)]="addForm.nombre" name="nombre" required placeholder="nombre">
        <label>Nombre</label>
      </div>
    </div>
    <div class="offcanvas-footer d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="offcanvas">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="AddForm.invalid">Guardar</button>
    </div>
  </form>
</div>

<div class="offcanvas offcanvas-end offcanvasEdit" tabindex="-1" id="offcanvasPermisoEdit">
  <form (submit)="onUpdate()" #EditForm="ngForm">
    <div class="offcanvas-header"><h6 class="offcanvas-title">Editar permiso</h6></div>
    <div class="offcanvas-body">
      <div class="form-floating mb-3">
        <input class="form-control" [(ngModel)]="editForm.modulo" name="modulo" required>
        <label>Módulo</label>
      </div>
      <div class="form-floating mb-3">
        <input class="form-control" [(ngModel)]="editForm.codigo" name="codigo" required>
        <label>Código</label>
      </div>
      <div class="form-floating mb-3">
        <input class="form-control" [(ngModel)]="editForm.nombre" name="nombre" required>
        <label>Nombre</label>
      </div>
    </div>
    <div class="offcanvas-footer d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="offcanvas" data-bs-dismiss-edit="true">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="EditForm.invalid">Guardar</button>
    </div>
  </form>
</div>

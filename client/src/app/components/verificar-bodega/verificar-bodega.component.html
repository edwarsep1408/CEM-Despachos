<div class="login-shell">
  <div class="login-card-wrap">
    <div class="login-logos">
      <img src="assets/img/logotipo.webp" width="120" alt="Pollocoa" />
    </div>

    <div class="login-text">
      <p class="login-title">¡ Bienvenido a CEM !</p>
      <p class="login-subtitle">Logística y Distribución</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger w-100 text-center" role="alert">
      {{ errorMessage }}
    </div>

    <form [formGroup]="registrarBodega" (submit)="onSubmit()" class="login-form">
      <div class="form-floating mb-3">
        <select class="form-select" formControlName="bodega" id="floatingSelect">
          <option [value]="''" selected disabled>--Seleccione una opción--</option>
          <option *ngFor="let item of bodegasData" [value]="item._id">
            {{ item.codigo }} - {{ item.nombre }}
          </option>
        </select>
        <label for="floatingSelect">Bodega</label>
      </div>
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          formControlName="cedula"
          id="floatingInput"
          placeholder="Cédula"
          autocomplete="off"
          required
        />
        <label for="floatingInput">Cédula</label>
      </div>
      <button class="login-submit" type="submit">Ingresar</button>
    </form>
  </div>
</div>

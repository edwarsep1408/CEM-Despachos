<div class="content-title">
  <div>
    <h3>Perfiles</h3>
    <p class="text-muted small mb-0">Agrupan permisos. Cada usuario se asocia a un perfil.</p>
  </div>
  <div class="d-grid gap-2 d-md-flex justify-content-md-end">
    <div class="input-group input-search">
      <span class="input-group-text search-icon"><i class="ri-search-line"></i></span>
      <input type="text" class="form-control search-input" (keyup)="applyFilter($event)" placeholder="Buscar">
    </div>
    <button type="button" class="btn btn-primary" data-bs-toggle="offcanvas" data-bs-target="#offcanvasPerfil">
      <i class="ri-add-circle-fill"></i> Nuevo perfil
    </button>
  </div>
</div>

<div class="mat-elevation-z4">
  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>NOMBRE</th>
      <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
    </ng-container>
    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>DESCRIPCIÓN</th>
      <td mat-cell *matCellDef="let row">{{ row.descripcion || "—" }}</td>
    </ng-container>
    <ng-container matColumnDef="permisos">
      <th mat-header-cell *matHeaderCellDef>PERMISOS</th>
      <td mat-cell *matCellDef="let row">{{ (row.permisos || []).length }}</td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>ACCIONES</th>
      <td mat-cell *matCellDef="let row">
        <button class="btn btn-edit" data-bs-toggle="offcanvas" data-bs-target="#offcanvasPerfilEdit" (click)="onClickDato(row)">
          <i class="bi bi-pencil-square"></i>
        </button>
        <button class="btn btn-delete" (click)="onDelete(row._id)"><i class="bi bi-trash3-fill"></i></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[10, 20, 50]" showFirstLastButtons></mat-paginator>
</div>

<div class="offcanvas offcanvas-end offcanvas-perfil" tabindex="-1" id="offcanvasPerfil">
  <form (submit)="onSubmit()" #AddForm="ngForm">
    <div class="offcanvas-header">
      <h6 class="offcanvas-title">Nuevo perfil</h6>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>
    <div class="offcanvas-body">
      <div class="form-floating mb-3">
        <input class="form-control" [(ngModel)]="addForm.nombre" name="nombre" required placeholder="nombre">
        <label>Nombre</label>
      </div>
      <div class="form-floating mb-3">
        <input class="form-control" [(ngModel)]="addForm.descripcion" name="descripcion" placeholder="descripción">
        <label>Descripción</label>
      </div>
      <p class="permisos-titulo">Permisos</p>
      <div class="permiso-grupo" *ngFor="let grupo of grupos">
        <label class="permiso-item permiso-item--modulo">
          <input type="checkbox" [checked]="moduloCompleto(addForm, grupo.items)" (change)="toggleModulo(addForm, grupo.items)">
          <span>{{ grupo.modulo }}</span>
        </label>
        <label class="permiso-item" *ngFor="let item of grupo.items">
          <input type="checkbox" [checked]="tiene(addForm, item.codigo)" (change)="toggle(addForm, item.codigo)">
          <span>{{ item.nombre }} <small class="text-muted">{{ item.codigo }}</small></span>
        </label>
      </div>
    </div>
    <div class="offcanvas-footer d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="offcanvas">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="AddForm.invalid">Guardar</button>
    </div>
  </form>
</div>

<div class="offcanvas offcanvas-end offcanvas-perfil" tabindex="-1" id="offcanvasPerfilEdit">
  <form (submit)="onUpdate()" #EditForm="ngForm">
    <div class="offcanvas-header">
      <h6 class="offcanvas-title">Editar perfil</h6>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>
    <div class="offcanvas-body">
      <div class="form-floating mb-3">
        <input class="form-control" [(ngModel)]="editForm.nombre" name="nombre" required>
        <label>Nombre</label>
      </div>
      <div class="form-floating mb-3">
        <input class="form-control" [(ngModel)]="editForm.descripcion" name="descripcion">
        <label>Descripción</label>
      </div>
      <p class="permisos-titulo">Permisos</p>
      <div class="permiso-grupo" *ngFor="let grupo of grupos">
        <label class="permiso-item permiso-item--modulo">
          <input type="checkbox" [checked]="moduloCompleto(editForm, grupo.items)" (change)="toggleModulo(editForm, grupo.items)">
          <span>{{ grupo.modulo }}</span>
        </label>
        <label class="permiso-item" *ngFor="let item of grupo.items">
          <input type="checkbox" [checked]="tiene(editForm, item.codigo)" (change)="toggle(editForm, item.codigo)">
          <span>{{ item.nombre }} <small class="text-muted">{{ item.codigo }}</small></span>
        </label>
      </div>
    </div>
    <div class="offcanvas-footer d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="offcanvas" data-bs-dismiss-edit="true">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="EditForm.invalid">Guardar</button>
    </div>
  </form>
</div>

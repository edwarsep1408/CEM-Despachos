<div class="content-title">
  <div class="col-mb-6">
    <h3>Motivos de omisión</h3>
    <p class="text-muted small mb-0">
      Catálogo para cuando se despacha menos de lo pedido o no se despacha un producto.
    </p>
  </div>
  <div class="col-mb-6 d-grid gap-2 d-md-flex justify-content-md-end">
    <div class="input-group input-search">
      <span class="input-group-text search-icon" id="basic-addon-motivos">
        <i class="ri-search-line"></i>
      </span>
      <input
        type="text"
        class="form-control search-input"
        (keyup)="applyFilter($event)"
        placeholder="Buscar"
        aria-label="Buscar"
        name="buscar"
        aria-describedby="basic-addon-motivos"
      />
    </div>
    <button
      type="button"
      class="btn btn-primary"
      data-bs-toggle="offcanvas"
      data-bs-target="#offcanvasMotivo"
      aria-controls="offcanvasMotivo"
    >
      <i class="ri-add-circle-fill"></i> Nuevo motivo
    </button>
  </div>
</div>

<div class="mat-elevation-z4">
  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container matColumnDef="idMotivo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let element">{{ element.idMotivo }}</td>
    </ng-container>
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>NOMBRE</th>
      <td mat-cell *matCellDef="let element">
        <div class="content-ilustration">
          <div class="ilustration"><i class="bx bx-block"></i></div>
          {{ element.nombre }}
        </div>
      </td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>ACCIONES</th>
      <td mat-cell *matCellDef="let element">
        <button
          class="btn btn-edit"
          data-bs-toggle="offcanvas"
          data-bs-target="#offcanvasMotivoEdit"
          aria-controls="offcanvasMotivoEdit"
          (click)="onClickDato(element)"
        >
          <i class="bi bi-pencil-square"></i>
        </button>
        <button class="btn btn-delete" (click)="onDelete(element._id)">
          <i class="bi bi-trash3-fill"></i>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasMotivo" aria-labelledby="offcanvasMotivoLabel">
  <form (submit)="onSubmit()" #AddForm="ngForm">
    <div class="offcanvas-header">
      <h6 class="offcanvas-title" id="offcanvasMotivoLabel">Nuevo motivo</h6>
    </div>
    <div class="offcanvas-body">
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control text-uppercase"
          [(ngModel)]="addForm.nombre"
          name="nombre"
          #nombre="ngModel"
          [ngClass]="{ 'is-invalid': nombre.invalid && (nombre.dirty || nombre.touched) }"
          id="motivoNombre"
          placeholder="Nombre"
          autocomplete="off"
          required
        />
        <label for="motivoNombre">Nombre</label>
      </div>
    </div>
    <div class="offcanvas-footer">
      <div class="d-grid gap-2 d-md-flex justify-content-md-end">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="offcanvas">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="AddForm.pristine || AddForm.invalid">Guardar</button>
      </div>
    </div>
  </form>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasMotivoEdit" aria-labelledby="offcanvasMotivoEditLabel">
  <form (submit)="onUpdate()" #EditForm="ngForm">
    <div class="offcanvas-header">
      <h6 class="offcanvas-title" id="offcanvasMotivoEditLabel">Editar motivo</h6>
    </div>
    <div class="offcanvas-body">
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control text-uppercase"
          [(ngModel)]="editForm.nombre"
          name="nombre"
          #editNombre="ngModel"
          [ngClass]="{ 'is-invalid': editNombre.invalid && (editNombre.dirty || editNombre.touched) }"
          id="motivoEditNombre"
          placeholder="Nombre"
          autocomplete="off"
          required
        />
        <label for="motivoEditNombre">Nombre</label>
      </div>
    </div>
    <div class="offcanvas-footer">
      <div class="d-grid gap-2 d-md-flex justify-content-md-end">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="offcanvas" data-bs-dismiss-edit="true">
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="EditForm.invalid">Guardar</button>
      </div>
    </div>
  </form>
</div>

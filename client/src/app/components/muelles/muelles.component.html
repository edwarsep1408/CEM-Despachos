<div class="content-title">
  <div class="col-mb-6">
    <h3>Muelles</h3>
    <p class="text-muted small mb-0">
      Muelles de despacho por bodega. Prado (PT001) tiene 3. La báscula se asocia al muelle; el despachador solo a la bodega.
    </p>
  </div>
  <div class="col-mb-6 d-grid gap-2 d-md-flex justify-content-md-end">
    <div class="input-group input-search">
      <span class="input-group-text search-icon"><i class="ri-search-line"></i></span>
      <input type="text" class="form-control search-input" (keyup)="applyFilter($event)" placeholder="Buscar" />
    </div>
    <button
      type="button"
      class="btn btn-primary"
      data-bs-toggle="offcanvas"
      data-bs-target="#offcanvasMuelle"
      (click)="cargarBodegas()"
    >
      <i class="ri-add-circle-fill"></i> Nuevo muelle
    </button>
  </div>
</div>

<div class="mat-elevation-z4">
  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>NOMBRE</th>
      <td mat-cell *matCellDef="let element">
        <div class="content-ilustration">
          <div class="ilustration"><i class="bx bx-dock-top"></i></div>
          {{ element.nombre }}
        </div>
      </td>
    </ng-container>
    <ng-container matColumnDef="bodega">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>BODEGA</th>
      <td mat-cell *matCellDef="let element">{{ etiquetaBodega(element) }}</td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>ACCIONES</th>
      <td mat-cell *matCellDef="let element">
        <button
          class="btn btn-edit"
          data-bs-toggle="offcanvas"
          data-bs-target="#offcanvasMuelleEdit"
          (click)="onClickDato(element)"
        >
          <i class="bi bi-pencil-square"></i>
        </button>
        <button class="btn btn-delete" (click)="onDelete(element._id)">
          <i class="bi bi-trash3-fill"></i>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasMuelle">
  <form (submit)="onSubmit()" #AddForm="ngForm">
    <div class="offcanvas-header">
      <h6 class="offcanvas-title">Nuevo muelle</h6>
    </div>
    <div class="offcanvas-body">
      <div class="form-floating mb-3">
        <select class="form-select" id="muelleBodega" [(ngModel)]="addForm.bodega" name="bodega" required>
          <option disabled value="">Seleccione una opción</option>
          <option *ngFor="let item of bodegas" [value]="item._id">{{ item.codigo }} - {{ item.nombre }}</option>
        </select>
        <label for="muelleBodega">Bodega</label>
      </div>
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          [(ngModel)]="addForm.nombre"
          name="nombre"
          id="muelleNombre"
          placeholder="Muelle 1"
          required
        />
        <label for="muelleNombre">Nombre</label>
      </div>
    </div>
    <div class="offcanvas-footer">
      <div class="d-grid gap-2 d-md-flex justify-content-md-end">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="offcanvas">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="AddForm.pristine || AddForm.invalid">Guardar</button>
      </div>
    </div>
  </form>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasMuelleEdit">
  <form (submit)="onUpdate()" #EditForm="ngForm">
    <div class="offcanvas-header">
      <h6 class="offcanvas-title">Editar muelle</h6>
    </div>
    <div class="offcanvas-body">
      <div class="form-floating mb-3">
        <select class="form-select" id="muelleEditBodega" [(ngModel)]="editForm.bodega" name="bodega" required>
          <option disabled value="">Seleccione una opción</option>
          <option *ngFor="let item of bodegas" [value]="item._id">{{ item.codigo }} - {{ item.nombre }}</option>
        </select>
        <label for="muelleEditBodega">Bodega</label>
      </div>
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          [(ngModel)]="editForm.nombre"
          name="nombre"
          id="muelleEditNombre"
          placeholder="Muelle 1"
          required
        />
        <label for="muelleEditNombre">Nombre</label>
      </div>
    </div>
    <div class="offcanvas-footer">
      <div class="d-grid gap-2 d-md-flex justify-content-md-end">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="offcanvas" data-bs-dismiss-edit="true">
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="EditForm.invalid">Guardar</button>
      </div>
    </div>
  </form>
</div>

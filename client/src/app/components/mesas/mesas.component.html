<div class="content-title">

  <div class="col-mb-6">
    <h3>Mesas</h3>
  </div>

  <div class=" col-mb-6 d-grid gap-2 d-md-flex justify-content-md-end">
    <div class="input-group input-search">
      <span class="input-group-text search-icon" id="basic-addon2">
        <i class="ri-search-line"></i>
      </span>
      <input type="text" class="form-control search-input" (keyup)="applyFilter($event)" placeholder="Buscar"
        aria-label="Buscar" name="buscar" aria-describedby="basic-addon2">
    </div>
    <button type="button" class="btn btn-primary" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight"
      (click)="onGetUnidadMedida()" aria-controls="offcanvasRight"> <i class="ri-add-circle-fill"></i> Nueva
      Mesa</button>
  </div>
</div>

<div class="mat-elevation-z4">
  <table mat-table [dataSource]="dataSource" matSort>


    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>NOMBRE</th>
      <td mat-cell *matCellDef="let element">
        <div class="content-ilustration">
          <div class="ilustration">
            <i class="bi bi-box"></i>
          </div>

          {{element.nombre}}
        </div>

      </td>
    </ng-container>

    <ng-container matColumnDef="bodega">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>BODEGA</th>
      <td mat-cell *matCellDef="let element"> {{element.bodega.nombre}} - {{element.bodega.codigo}} </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> ACCIONES </th>
      <td mat-cell *matCellDef="let element">
        <button class="btn btn-edit" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRightEdit"
          aria-controls="offcanvasRightEdit" (click)="onClickDato(element); onGetUnidadMedida() ">
          <i class="bi bi-pencil-square"></i>
        </button>
        <button class="btn btn-delete" (click)="onDelete(element._id)">
          <i class="bi bi-trash3-fill"></i>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page of periodic elements">
  </mat-paginator>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
  <form (submit)="onSubmit()" #AddForm="ngForm" method="post">
    <div class="offcanvas-header">
      <h6 class="offcanvas-title" id="offcanvasRightLabel">Información Mesas</h6>
    </div>

    <div class="offcanvas-body">
      <div class="form-floating mb-3">
        <input type="text" class="form-control" [(ngModel)]='addForm.nombre' name="nombre" #nombre="ngModel"
          [ngClass]="{'is-invalid': nombre.invalid && (nombre.dirty || nombre.touched)}" id="floatingInput" placeholder="Tipo"
          autocomplete="off" required>
        <label for="floatingInput">Nombre</label>
      </div>

      <div class="form-floating mb-3">
        <select class="form-select" id="floatingSelect" [(ngModel)]='addForm.bodega' name="bodega"
          aria-label="Floating label select example" #unidadMedida="ngModel"
          [ngClass]="{'is-invalid': unidadMedida.invalid && (unidadMedida.dirty || unidadMedida.touched)}" required>
          <option selected disabled value="">Seleccione una opción</option>
          <option *ngFor="let item of unidadesMedida" [value]="item._id">{{item.codigo}} - {{item.nombre}} </option>
        </select>
        <label for="floatingSelect">Bodega</label>
      </div>

    </div>
    <div class="offcanvas-footer">
      <div class="d-grid gap-2 d-md-flex justify-content-md-end">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="offcanvas">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="(AddForm.pristine || AddForm.invalid)
        ">Guardar</button>
      </div>
    </div>
  </form>

</div>

<div class="offcanvas offcanvas-end offcanvasEdit" tabindex="-1" id="offcanvasRightEdit"
  aria-labelledby="offcanvasRightEditLabel">
  <form (submit)="onUpdate()" #EditForm="ngForm" method="post">
    <div class="offcanvas-header">
      <h6 class="offcanvas-title" id="offcanvasRightEditLabel">Información Mesas</h6>
    </div>

    <div class="offcanvas-body">
      <div class="form-floating mb-3">
        <input type="text" class="form-control" [(ngModel)]='editForm.nombre' name="nombre" #editNombre="ngModel"
          [ngClass]="{'is-invalid': editNombre.invalid && (editNombre.dirty || editNombre.touched)}" id="floatingInput"
          placeholder="Tipo" autocomplete="off" required>
        <label for="floatingInput">Nombre</label>
      </div>

      <div class="form-floating mb-3">
        <select class="form-select" id="floatingSelect" [(ngModel)]='editForm.bodega' name="bodega"
          aria-label="Floating label select example" #editUnidadMedida="ngModel"
          [ngClass]="{'is-invalid': editUnidadMedida.invalid && (editUnidadMedida.dirty || editUnidadMedida.touched)}"
          required>
          <option selected disabled value="">Seleccione una opción</option>
          <option *ngFor="let item of unidadesMedida" [value]="item._id">{{item.codigo}} - {{item.nombre}} </option>

        </select>
        <label for="floatingSelect">Bodega</label>
      </div>
    </div>
    <div class="offcanvas-footer">
      <div class="d-grid gap-2 d-md-flex justify-content-md-end">
        <button type="button" class="btn btn-secondary btn-edit" data-bs-dismiss="offcanvas"
          data-bs-dismiss-edit="true">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="(EditForm.pristine || EditForm.invalid)
        ">Guardar</button>
      </div>
    </div>
  </form>

</div>

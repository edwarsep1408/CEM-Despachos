<div class="content-title">

  <div class="col-mb-6">
    <h3>Bodegas</h3>
    <p class="text-muted small mb-0">Catálogo de bodegas SIESA para despacho e inventario.</p>
  </div>

  <div class=" col-mb-6 d-grid gap-2 d-md-flex justify-content-md-end">
    <div class="input-group input-search">
      <span class="input-group-text search-icon" id="basic-addon2">
        <i class="ri-search-line"></i>
      </span>
      <input type="text" class="form-control search-input" (keyup)="applyFilter($event)" placeholder="Buscar"
        aria-label="Buscar" name="buscar" aria-describedby="basic-addon2">
    </div>
    <button type="button" class="btn btn-primary" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight"
      aria-controls="offcanvasRight"> <i class="ri-add-circle-fill"></i> Nueva Bodega</button>
  </div>
</div>

<p class="text-muted small px-1" *ngIf="cargando">Consultando bodegas en SIESA…</p>

<div class="mat-elevation-z4">
  <table mat-table [dataSource]="dataSource" matSort>


    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>NOMBRE</th>
      <td mat-cell *matCellDef="let element">
        <div class="content-ilustration">
          <div class="ilustration">
            <i class="bi bi-box"></i>
          </div>

          {{element.nombre}}
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>CÓDIGO</th>
      <td mat-cell *matCellDef="let element"> {{element.codigo}} </td>
    </ng-container>

    <ng-container matColumnDef="ubicacion">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>UBICACION</th>
      <td mat-cell *matCellDef="let element"> {{element.ubicacion}} </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> ACCIONES </th>
      <td mat-cell *matCellDef="let element">
        <button class="btn btn-edit" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRightEdit"
          aria-controls="offcanvasRightEdit" (click)="onClickDato(element) ">
          <i class="bi bi-pencil-square"></i>
        </button>
        <button class="btn btn-delete" (click)="onDelete(element._id)">
          <i class="bi bi-trash3-fill"></i>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page of periodic elements">
  </mat-paginator>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
  <form (submit)="onSubmit()" #AddForm="ngForm" method="post">
    <div class="offcanvas-header">
      <h6 class="offcanvas-title" id="offcanvasRightLabel">Información Bodega</h6>
    </div>

    <div class="offcanvas-body">
      <div class="form-floating mb-3">
        <input type="text" class="form-control" [(ngModel)]='addForm.nombre' name="nombre" #nombre="ngModel"
          [ngClass]="{'is-invalid': nombre.invalid && (nombre.dirty || nombre.touched)}" id="floatingInput"
          placeholder="nombre" autocomplete="off" required>
        <label for="floatingInput">Nombre</label>
      </div>
      <div class="form-floating mb-3">
        <input type="text" class="form-control" [(ngModel)]='addForm.codigo' name="codigo" #codigo="ngModel"
          [ngClass]="{'is-invalid': codigo.invalid && (codigo.dirty || codigo.touched)}" id="floatingInput"
          placeholder="codigo" autocomplete="off" required>
        <label for="floatingInput">Codigo</label>
      </div>
      <div class="form-floating mb-3">
        <input type="text" class="form-control" [(ngModel)]='addForm.ubicacion' name="usuario" id="floatingInput"
          #ubicacion="ngModel" [ngClass]="{'is-invalid': ubicacion.invalid && (ubicacion.dirty || ubicacion.touched)}"
          placeholder="Ubicación" autocomplete="off" required>
        <label for="floatingInput">Ubicación</label>
      </div>
    </div>
    <div class="offcanvas-footer">
      <div class="d-grid gap-2 d-md-flex justify-content-md-end">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="offcanvas">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="(AddForm.pristine || AddForm.invalid)
        ">Guardar</button>
      </div>
    </div>
  </form>

</div>

<div class="offcanvas offcanvas-end offcanvasEdit" tabindex="-1" id="offcanvasRightEdit"
  aria-labelledby="offcanvasRightEditLabel">
  <form (submit)="onUpdate()" #EditForm="ngForm" method="post">
    <div class="offcanvas-header">
      <h6 class="offcanvas-title" id="offcanvasRightEditLabel">Información Bodega</h6>
    </div>

    <div class="offcanvas-body">
      <div class="form-floating mb-3">
        <input type="text" class="form-control" [(ngModel)]='editForm.nombre' name="nombre" #editNombre="ngModel"
          [ngClass]="{'is-invalid': editNombre.invalid && (editNombre.dirty || editNombre.touched)}" id="floatingInput"
          placeholder="nombre" autocomplete="off" required>
        <label for="floatingInput">Nombre</label>
      </div>
      <div class="form-floating mb-3">
        <input type="text" class="form-control" [(ngModel)]='editForm.codigo' name="codigo" #editCodigo="ngModel"
          [ngClass]="{'is-invalid': editCodigo.invalid && (editCodigo.dirty || editCodigo.touched)}" id="floatingInput"
          placeholder="Codigo" autocomplete="off" required>
        <label for="floatingInput">Codigo</label>
      </div>
      <div class="form-floating mb-3">
        <input type="text" class="form-control" [(ngModel)]='editForm.ubicacion' name="mail" #editUbicacion="ngModel"
          [ngClass]="{'is-invalid': editUbicacion.invalid && (editUbicacion.dirty || editUbicacion.touched)}"
          id="floatingInput" placeholder="Ubicación" autocomplete="off" required>
        <label for="floatingInput">Ubicación</label>
      </div>
    </div>
    <div class="offcanvas-footer">
      <div class="d-grid gap-2 d-md-flex justify-content-md-end">
        <button type="button" class="btn btn-secondary btn-edit" data-bs-dismiss="offcanvas"
          data-bs-dismiss-edit="true">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="(EditForm.pristine || EditForm.invalid)
        ">Guardar</button>
      </div>
    </div>
  </form>

</div>
